# Installed to /etc/dkms/nvidia-current-open.conf (sourced by DKMS after dkms.conf).
# Runs the #1143204 patch hook before every nvidia-current-open build, for any
# kernel and any package version. PRE_BUILD must be relative to the build dir.
PRE_BUILD="$(realpath -m --relative-to="$dkms_tree/$module/$module_version/build" /usr/local/sbin/nvidia-1143204-prebuild)"
